<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Launching Minecraft...</title>
    <script>
        // Instantly triggers the Minecraft launcher
        window.location.href = "minecraft:";

        // Automatically closes the blank web tab after 2 seconds
        setTimeout(function() {
            window.close();
        }, 2000);
    </script>
</head>
<body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">
        Launching Minecraft... You can close this tab.
    </p>
</body>
</html>
